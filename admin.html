<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>홈페이지 관리 | 마리아동청소년상담센터</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:#f6f3ef;color:#2b2b2b;font-size:14px;line-height:1.6}
button,input,textarea,select{font:inherit}
.hidden{display:none!important}
.top{position:sticky;top:0;z-index:20;background:#5b4636;color:#fff;display:flex;align-items:center;gap:12px;padding:10px 18px}
.top h1{font-size:16px;flex:1}
.top .st{font-size:12px;opacity:.85}
.btn{border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600}
.btn.pri{background:#fff;color:#5b4636}
.btn.dark{background:#5b4636;color:#fff}
.btn.line{background:#fff;border:1px solid #d8cfc5;color:#5b4636}
.btn.sm{padding:5px 10px;font-size:12px;font-weight:500}
.btn.del{background:#fff;border:1px solid #e9c9c9;color:#b54040}
.btn:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid #e6dfd7;padding:0 12px;position:sticky;top:52px;z-index:19}
.tabs button{background:none;border:0;padding:13px 14px;cursor:pointer;white-space:nowrap;color:#777;border-bottom:3px solid transparent}
.tabs button.on{color:#5b4636;font-weight:700;border-color:#5b4636}
.panel{max-width:820px;margin:0 auto;padding:24px 18px 120px}
.card{background:#fff;border:1px solid #e6dfd7;border-radius:12px;padding:20px;margin-bottom:16px}
.card h2{font-size:16px;margin-bottom:4px}
.card .hint{font-size:12px;color:#8a8077;margin-bottom:14px}
.f{margin-bottom:14px}
.f label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
.f small{display:block;color:#8a8077;font-size:12px;margin-top:3px}
input[type=text],input[type=password],textarea{width:100%;border:1px solid #d8cfc5;border-radius:8px;padding:9px 11px;background:#fff}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus{outline:2px solid #c9b8a6;border-color:#c9b8a6}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row input[type=text],.row textarea{flex:1;min-width:0}
.ctrl{display:flex;gap:4px;flex:none}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.thumb{position:relative;width:120px}
.thumb img{width:120px;height:90px;object-fit:cover;border-radius:6px;border:1px solid #e6dfd7;background:#eee}
.thumb .ctrl{margin-top:4px;justify-content:center}
.thumb .no{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;border-radius:4px;padding:0 6px}
.upl{display:inline-flex;align-items:center;gap:6px;border:1px dashed #c9b8a6;border-radius:8px;padding:9px 14px;cursor:pointer;color:#5b4636;background:#fbf8f5;font-weight:600}
.upl input{display:none}
.item{border:1px solid #e6dfd7;border-radius:10px;padding:14px;margin-bottom:12px;background:#fdfcfa}
.item-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.item-head b{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.one-photo{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.one-photo img{width:96px;height:128px;object-fit:cover;border-radius:6px;border:1px solid #e6dfd7;background:#eee}
.one-photo .empty{width:96px;height:128px;border-radius:6px;border:1px dashed #d8cfc5;display:grid;place-items:center;color:#aaa;font-size:12px;text-align:center}
.login{max-width:440px;margin:60px auto;padding:0 18px}
.login .card{padding:28px}
.login h1{font-size:20px;margin-bottom:6px;color:#5b4636}
.msg{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b2b2b;color:#fff;padding:12px 20px;border-radius:10px;z-index:50;max-width:90vw;text-align:center}
.msg.err{background:#b54040}
.pv{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;flex-direction:column}
.pv-bar{background:#fff;display:flex;gap:8px;align-items:center;padding:8px 12px}
.pv-bar b{flex:1}
.pv iframe{flex:1;border:0;background:#fff;width:100%}
.dirty{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffcf5c;margin-right:6px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}.top .st{display:none}}
</style>
</head>
<body>

<!-- 로그인 -->
<div class="login" id="loginView">
  <div class="card">
    <h1>홈페이지 관리</h1>
    <p class="hint" style="color:#8a8077;margin-bottom:18px">처음 한 번만 입력하면 이 기기에서 기억합니다.</p>
    <div class="f"><label>GitHub 아이디</label><input type="text" id="lgOwner" placeholder="예: maryhome" autocomplete="username"></div>
    <div class="f"><label>저장소 이름</label><input type="text" id="lgRepo" placeholder="예: mary-counsel"></div>
    <div class="f"><label>접근 토큰</label><input type="password" id="lgToken" placeholder="github_pat_..." autocomplete="current-password"><small>배포방법.md의 “관리자 토큰 만들기”를 참고하세요.</small></div>
    <button class="btn dark" id="lgBtn" style="width:100%">로그인</button>
  </div>
</div>

<!-- 편집 화면 -->
<div id="appView" class="hidden">
  <div class="top">
    <h1>마리 홈페이지 관리</h1>
    <span class="st" id="state"></span>
    <button class="btn line sm" id="pvBtn">미리보기</button>
    <button class="btn pri" id="saveBtn">저장하기</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <div class="panel" id="panel"></div>
  <p style="text-align:center;font-size:12px;color:#aaa;padding-bottom:30px"><a href="#" id="logout" style="color:#aaa">로그아웃</a></p>
</div>

<div class="pv hidden" id="pv"><div class="pv-bar"><b>미리보기 (저장 전)</b><button class="btn line sm" data-pvw="390">모바일</button><button class="btn line sm" data-pvw="">PC</button><button class="btn dark sm" id="pvClose">닫기</button></div><iframe id="pvFrame"></iframe></div>

<script src="assets/render.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
